services:
  mysql:
    image: mysql:8.4
    container_name: relb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: real_estate_leads
      MYSQL_USER: relb
      MYSQL_PASSWORD: relbsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relb-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://relb:relbsecret@mysql:3306/real_estate_leads
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/lead-process-message
      N8N_WEBHOOK_SECRET: change-me-n8n-secret
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
      APP_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "python -c 'from app.db.base import Base, engine; from app.models import Lead, Conversation, Message; Base.metadata.create_all(bind=engine); print(\"DB tables ready\")' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: relb-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - GENERIC_TIMEZONE=Africa/Lagos
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - API_BASE_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - LLM_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - SALES_NOTIFY_WEBHOOK_URL=${SALES_NOTIFY_WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: relb-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  n8n_data:
